{% extends "base.html" %}

{% block title %}Create Warehouse - Warehouse Manager{% endblock %}

{% block content %}
<a href="{{ url_for('index') }}" class="back-link">&larr; Back to warehouses</a>

<div class="card">
    <h2 style="margin-bottom: 1.5rem;">Create New Warehouse</h2>
    
    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="POST">
        <div class="form-group">
            <label for="name">Warehouse Name</label>
            <input type="text" id="name" name="name" required placeholder="Enter warehouse name">
        </div>
        
        <div class="form-group">
            <label for="capacity">Capacity (units)</label>
            <input type="number" id="capacity" name="capacity" required min="0.1" step="0.1" placeholder="Enter capacity">
        </div>
        
        <div class="actions">
            <button type="submit" class="btn btn-primary">Create Warehouse</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
